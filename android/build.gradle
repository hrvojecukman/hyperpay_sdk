group 'com.hyperpay.sdk'
version '7.11.0'

buildscript {
    ext.kotlin_version = '2.0.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.hyperpay.sdk'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 24
        targetSdk 35
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // HyperPay OPPWA SDK (via JitPack)
    api 'com.github.hrvojecukman.hyperpay_sdk_android:oppwa:v7.11.0.0:oppwa@aar'

    // 3DS2 SDK — debug vs release variants (via JitPack)
    debugApi 'com.github.hrvojecukman.hyperpay_sdk_android:ipworks3ds:v7.11.0.0:ipworks3ds@aar'
    releaseApi 'com.github.hrvojecukman.hyperpay_sdk_android:ipworks3ds_deploy:v7.11.0.0:ipworks3ds_deploy@aar'

    // AndroidX & Google dependencies required by OPPWA SDK
    // (mirrors dependencies.txt shipped with Android_Frameworks_7.11.0)
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    // OPPWA's CheckoutViewModel.getTransactionResultLiveData() uses MediatorLiveData,
    // which ships in lifecycle-livedata — NOT in lifecycle-livedata-core (LiveData,
    // MutableLiveData, Observer) that appcompat/fragment pull in transitively, and NOT
    // in lifecycle-viewmodel-ktx (whose only runtime deps are lifecycle-viewmodel,
    // kotlin-stdlib and kotlinx-coroutines-android — its lifecycle-livedata entry is a
    // BOM *constraint*, so it never lands on the graph). The deprecated
    // lifecycle-extensions:2.2.0 this plugin used up to 2.3.2 did pull it in, so
    // dropping it in 2.4.0 turned BaseServiceActivity.onStart() into a hard
    // NoClassDefFoundError on androidx.lifecycle.MediatorLiveData. HyperPay's
    // dependencies.txt omits this — their own 7.11.0 Demo app still declares
    // lifecycle-extensions:2.2.0, which is where it came from.
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'com.google.android.gms:play-services-wallet:19.4.0'

    // PayPal / Venmo (Braintree) brands added in OPPWA 7.11.0 are not wired into
    // this plugin, so their Braintree dependencies are intentionally omitted:
    //   com.braintreepayments.api:paypal:5.18.0
    //   com.braintreepayments.api:venmo:5.18.0
    //   com.braintreepayments.api:data-collector:5.18.0

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
